<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">TaskFlow - Collaborative Task Management</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/css/main.css">
    <!-- Lucide Icons via unpkg -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 flex h-screen overflow-hidden antialiased">

    <!-- Left Sidebar -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col flex-shrink-0 z-20 transition-all duration-200">
        <!-- Brand / Logo -->
        <div class="h-16 flex items-center px-6 border-b border-slate-800">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-lg bg-sky-600 flex items-center justify-center text-white font-bold shadow-md shadow-sky-600/30">
                    <i data-lucide="check-square" class="w-5 h-5"></i>
                </div>
                <div>
                    <span class="text-white font-bold text-lg tracking-tight">TaskFlow</span>
                    <span class="text-xs block text-slate-400 font-medium">Collaborative Hub</span>
                </div>
            </div>
        </div>

        <!-- Navigation Links -->
        <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto custom-scrollbar">
            <div class="px-2 pb-2 text-[11px] font-semibold text-slate-500 uppercase tracking-wider">Workspace</div>
            
            <a th:href="@{/dashboard}"
               th:classappend="${activeNav == 'dashboard'} ? 'bg-sky-600 text-white shadow-sm' : 'text-slate-300 hover:bg-slate-800 hover:text-white'"
               class="flex items-center px-3 py-2.5 text-sm font-medium rounded-lg transition-colors">
                <i data-lucide="layout-dashboard" class="w-4 h-4 mr-3"></i>
                Dashboard
            </a>

            <a th:href="@{/tasks}"
               th:classappend="${activeNav == 'tasks'} ? 'bg-sky-600 text-white shadow-sm' : 'text-slate-300 hover:bg-slate-800 hover:text-white'"
               class="flex items-center px-3 py-2.5 text-sm font-medium rounded-lg transition-colors">
                <i data-lucide="check-circle" class="w-4 h-4 mr-3"></i>
                Tasks
            </a>

            <a th:href="@{/kanban}"
               th:classappend="${activeNav == 'kanban'} ? 'bg-sky-600 text-white shadow-sm' : 'text-slate-300 hover:bg-slate-800 hover:text-white'"
               class="flex items-center px-3 py-2.5 text-sm font-medium rounded-lg transition-colors">
                <i data-lucide="trello" class="w-4 h-4 mr-3"></i>
                Kanban Board
            </a>

            <a th:href="@{/projects}"
               th:classappend="${activeNav == 'projects'} ? 'bg-sky-600 text-white shadow-sm' : 'text-slate-300 hover:bg-slate-800 hover:text-white'"
               class="flex items-center px-3 py-2.5 text-sm font-medium rounded-lg transition-colors">
                <i data-lucide="folder-kanban" class="w-4 h-4 mr-3"></i>
                Projects
            </a>

            <div class="pt-6 px-2 pb-2 text-[11px] font-semibold text-slate-500 uppercase tracking-wider">Account</div>

            <a th:href="@{/profile}"
               th:classappend="${activeNav == 'profile'} ? 'bg-sky-600 text-white shadow-sm' : 'text-slate-300 hover:bg-slate-800 hover:text-white'"
               class="flex items-center px-3 py-2.5 text-sm font-medium rounded-lg transition-colors">
                <i data-lucide="user" class="w-4 h-4 mr-3"></i>
                Profile & Settings
            </a>
        </nav>

        <!-- Sidebar User Badge & Logout -->
        <div class="p-4 border-t border-slate-800 bg-slate-900/80">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3 overflow-hidden">
                    <div class="w-9 h-9 rounded-full flex items-center justify-center text-white text-xs font-bold shrink-0 bg-sky-500 shadow-sm"
                         th:text="${#authentication.principal.initials}">
                        JD
                    </div>
                    <div class="truncate">
                        <p class="text-sm font-medium text-white truncate" th:text="${#authentication.principal.fullName}">User</p>
                        <p class="text-xs text-slate-400 truncate" th:text="${#authentication.principal.username}">@user</p>
                    </div>
                </div>
                <form th:action="@{/logout}" method="post" class="inline">
                    <button type="submit" title="Sign out"
                            class="text-slate-400 hover:text-rose-400 p-1.5 rounded-lg hover:bg-slate-800 transition-colors">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                    </button>
                </form>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Top App Bar -->
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 z-10">
            <div class="flex items-center space-x-4">
                <h1 class="text-lg font-semibold text-slate-800" th:text="${pageTitle}">Workspace</h1>
            </div>

            <div class="flex items-center space-x-3">
                <a th:href="@{/tasks/new}"
                   class="inline-flex items-center px-3.5 py-1.5 bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold rounded-lg shadow-sm transition-colors">
                    <i data-lucide="plus" class="w-4 h-4 mr-1.5"></i>
                    New Task
                </a>
                <a th:href="@{/projects/new}"
                   class="inline-flex items-center px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg border border-slate-300 transition-colors">
                    <i data-lucide="folder-plus" class="w-4 h-4 mr-1.5"></i>
                    New Project
                </a>
            </div>
        </header>

        <!-- Flash Messages Alert Notifications -->
        <div class="px-6 pt-4 space-y-2">
            <div th:if="${successMessage}"
                 class="auto-dismiss-alert bg-emerald-50 border border-emerald-200 text-emerald-800 px-4 py-3 rounded-lg text-sm flex items-center justify-between shadow-sm">
                <div class="flex items-center space-x-2">
                    <i data-lucide="check-circle" class="w-4 h-4 text-emerald-600 shrink-0"></i>
                    <span th:text="${successMessage}">Success!</span>
                </div>
                <button onclick="this.parentElement.remove()" class="text-emerald-500 hover:text-emerald-700">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <div th:if="${errorMessage}"
                 class="auto-dismiss-alert bg-rose-50 border border-rose-200 text-rose-800 px-4 py-3 rounded-lg text-sm flex items-center justify-between shadow-sm">
                <div class="flex items-center space-x-2">
                    <i data-lucide="alert-circle" class="w-4 h-4 text-rose-600 shrink-0"></i>
                    <span th:text="${errorMessage}">Error occurred!</span>
                </div>
                <button onclick="this.parentElement.remove()" class="text-rose-500 hover:text-rose-700">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <!-- Page View Body -->
        <main class="flex-1 overflow-y-auto p-6 custom-scrollbar">
            <div th:replace="${content}">
                <!-- Injected page content goes here -->
            </div>
        </main>
    </div>

    <!-- Initialize Lucide icons on page render -->
    <script>
        lucide.createIcons();
    </script>
    <script src="/js/main.js"></script>
</body>
</html>
