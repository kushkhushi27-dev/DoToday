<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::#content})}">
<head>
    <title>Profile - TaskFlow</title>
</head>
<body>
    <div id="content" class="max-w-xl mx-auto space-y-6">

        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 sm:p-8 space-y-6">
            <div class="flex items-center space-x-4 border-b border-slate-100 pb-6">
                <div class="w-14 h-14 rounded-full flex items-center justify-center text-white text-lg font-bold shadow-md shrink-0"
                     th:style="'background-color: ' + ${user.avatarColor}"
                     th:text="${user.initials}">
                    JD
                </div>
                <div>
                    <h2 class="text-lg font-bold text-slate-900" th:text="${user.fullName}">Full Name</h2>
                    <p class="text-xs text-slate-500" th:text="'@' + ${user.username} + ' • ' + ${user.email}">user@example.com</p>
                    <div class="flex items-center space-x-1.5 mt-2">
                        <span th:each="role : ${user.roles}"
                              class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-sky-50 text-sky-700 uppercase"
                              th:text="${role.name.replace('ROLE_', '')}">USER</span>
                    </div>
                </div>
            </div>

            <!-- Profile Edit Form -->
            <form th:action="@{/profile}" method="post" class="space-y-4">
                <div>
                    <label for="fullName" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                        Full Name
                    </label>
                    <input id="fullName" name="fullName" type="text" th:value="${user.fullName}" required
                           class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
                </div>

                <div>
                    <label for="bio" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                        Bio / Technical Focus
                    </label>
                    <textarea id="bio" name="bio" rows="3"
                              class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-500"
                              placeholder="Share your specialization, team role, or working hours..."
                              th:text="${user.bio}"></textarea>
                </div>

                <div class="pt-4 border-t border-slate-100 flex justify-end">
                    <button type="submit"
                            class="px-5 py-2 bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold rounded-lg shadow-sm transition-colors">
                        Save Profile
                    </button>
                </div>
            </form>
        </div>

    </div>
</body>
</html>
