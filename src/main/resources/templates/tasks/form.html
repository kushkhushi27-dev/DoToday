<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::#content})}">
<head>
    <title th:text="${isEdit ? 'Edit Task - DoToday' : 'Create Task - DoToday'}">Task Form</title>
</head>
<body>
    <div id="content" class="max-w-2xl mx-auto space-y-6">

        <!-- Card Container -->
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 sm:p-8">
            <div class="border-b border-slate-100 pb-4 mb-6">
                <h2 class="text-lg font-bold text-slate-900" th:text="${isEdit ? 'Edit Task' : 'Create New Task'}">Task</h2>
                <p class="text-xs text-slate-500 mt-1">Specify task requirements, assign collaborators, and schedule deadlines.</p>
            </div>

            <!-- Form -->
            <form th:action="${isEdit ? '/tasks/' + taskId + '/edit' : '/tasks'}"
                  th:object="${task}" method="post" class="space-y-5">

                <!-- Title -->
                <div>
                    <label for="title" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                        Task Title <span class="text-rose-500">*</span>
                    </label>
                    <input id="title" th:field="*{title}" type="text" required
                           class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500"
                           placeholder="e.g., Implement OAuth2 integration with Spring Security">
                    <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="mt-1 text-xs text-rose-600"></p>
                </div>

                <!-- Description -->
                <div>
                    <label for="description" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                        Description
                    </label>
                    <textarea id="description" th:field="*{description}" rows="4"
                              class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500"
                              placeholder="Provide detailed context, acceptance criteria, or relevant technical notes..."></textarea>
                </div>

                <!-- Priority & Status Row -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Priority -->
                    <div>
                        <label for="priority" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                            Priority <span class="text-rose-500">*</span>
                        </label>
                        <select id="priority" th:field="*{priority}" required
                                class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-500 bg-white">
                            <option th:each="p : ${T(com.dotoday.entity.TaskPriority).values()}"
                                    th:value="${p}"
                                    th:text="${p.displayName}">Medium</option>
                        </select>
                    </div>

                    <!-- Status -->
                    <div>
                        <label for="status" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                            Status <span class="text-rose-500">*</span>
                        </label>
                        <select id="status" th:field="*{status}" required
                                class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-500 bg-white">
                            <option th:each="st : ${T(com.dotoday.entity.TaskStatus).values()}"
                                    th:value="${st}"
                                    th:text="${st.displayName}">To Do</option>
                        </select>
                    </div>
                </div>

                <!-- Due Date & Category Row -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Due Date -->
                    <div>
                        <label for="dueDate" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                            Due Date
                        </label>
                        <input id="dueDate" th:field="*{dueDate}" type="date"
                               class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-500 bg-white">
                    </div>

                    <!-- Category / Tag -->
                    <div>
                        <label for="category" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                            Category / Tag
                        </label>
                        <input id="category" th:field="*{category}" type="text"
                               class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-500"
                               placeholder="e.g., Backend, Frontend, DevOps, Bug">
                    </div>
                </div>

                <!-- Project & Assignee Row -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Project -->
                    <div>
                        <label for="projectId" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                            Assign to Project
                        </label>
                        <select id="projectId" th:field="*{projectId}"
                                class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-500 bg-white">
                            <option value="">None (Personal Task)</option>
                            <option th:each="proj : ${projects}"
                                    th:value="${proj.id}"
                                    th:text="${proj.name}">Project Name</option>
                        </select>
                    </div>

                    <!-- Assignee -->
                    <div>
                        <label for="assigneeId" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                            Assignee
                        </label>
                        <select id="assigneeId" th:field="*{assigneeId}"
                                class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-500 bg-white">
                            <option value="">Select Collaborator</option>
                            <option th:each="u : ${users}"
                                    th:value="${u.id}"
                                    th:text="${u.fullName + ' (@' + u.username + ')'}">User</option>
                        </select>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="pt-4 border-t border-slate-100 flex items-center justify-end space-x-3">
                    <a th:href="@{/tasks}" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:text-slate-800 rounded-lg hover:bg-slate-100 transition-colors">
                        Cancel
                    </a>
                    <button type="submit"
                            class="px-5 py-2 bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold rounded-lg shadow-sm transition-colors">
                        <span th:text="${isEdit ? 'Save Changes' : 'Create Task'}">Save</span>
                    </button>
                </div>

            </form>
        </div>

    </div>
</body>
</html>
