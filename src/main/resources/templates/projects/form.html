<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::#content})}">
<head>
    <title>Create Project - DoToday</title>
</head>
<body>
    <div id="content" class="max-w-xl mx-auto space-y-6">

        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 sm:p-8">
            <div class="border-b border-slate-100 pb-4 mb-6">
                <h2 class="text-lg font-bold text-slate-900">Create New Project</h2>
                <p class="text-xs text-slate-500 mt-1">Set up a collaborative team workspace for tracking deliverables.</p>
            </div>

            <form th:action="@{/projects}" th:object="${project}" method="post" class="space-y-5">
                <div>
                    <label for="name" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                        Project Name <span class="text-rose-500">*</span>
                    </label>
                    <input id="name" th:field="*{name}" type="text" required
                           class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-500"
                           placeholder="e.g., Cloud Migration & Microservices">
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 text-xs text-rose-600"></p>
                </div>

                <div>
                    <label for="description" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                        Description
                    </label>
                    <textarea id="description" th:field="*{description}" rows="4"
                              class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-500"
                              placeholder="Describe goals, milestones, or team focus areas..."></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                        Theme Color Accent
                    </label>
                    <div class="flex items-center space-x-3">
                        <label class="cursor-pointer">
                            <input type="radio" th:field="*{color}" value="#3B82F6" class="sr-only peer">
                            <span class="w-8 h-8 rounded-full bg-blue-500 block peer-checked:ring-4 peer-checked:ring-blue-200"></span>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" th:field="*{color}" value="#8B5CF6" class="sr-only peer">
                            <span class="w-8 h-8 rounded-full bg-sky-500 block peer-checked:ring-4 peer-checked:ring-sky-200"></span>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" th:field="*{color}" value="#10B981" class="sr-only peer">
                            <span class="w-8 h-8 rounded-full bg-emerald-500 block peer-checked:ring-4 peer-checked:ring-emerald-200"></span>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" th:field="*{color}" value="#F59E0B" class="sr-only peer">
                            <span class="w-8 h-8 rounded-full bg-amber-500 block peer-checked:ring-4 peer-checked:ring-amber-200"></span>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" th:field="*{color}" value="#EF4444" class="sr-only peer">
                            <span class="w-8 h-8 rounded-full bg-rose-500 block peer-checked:ring-4 peer-checked:ring-rose-200"></span>
                        </label>
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-100 flex items-center justify-end space-x-3">
                    <a th:href="@{/projects}" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:text-slate-800 rounded-lg hover:bg-slate-100 transition-colors">
                        Cancel
                    </a>
                    <button type="submit"
                            class="px-5 py-2 bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold rounded-lg shadow-sm transition-colors">
                        Create Project
                    </button>
                </div>
            </form>
        </div>

    </div>
</body>
</html>
