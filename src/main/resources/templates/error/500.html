<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error - TaskFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6 text-center">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-4">
        <div class="w-12 h-12 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center mx-auto">
            <i data-lucide="server-crash" class="w-6 h-6"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-900">Application Error</h1>
        <p class="text-sm text-slate-600" th:text="${errorMessage != null ? errorMessage : 'Something went wrong while processing your request.'}">
            Server error.
        </p>
        <div class="pt-4">
            <a th:href="@{/dashboard}"
               class="inline-flex items-center px-4 py-2 bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold rounded-lg shadow-sm transition-colors">
                <i data-lucide="home" class="w-4 h-4 mr-1.5"></i>
                Return to Dashboard
            </a>
        </div>
    </div>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
