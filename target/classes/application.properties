# Server Configuration
server.port=3000
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always

# Application Info
spring.application.name=TaskFlow

# Database Configuration (MySQL / MariaDB)
spring.datasource.url=jdbc:mariadb://localhost:3306/taskflow_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&autoReconnect=true
spring.datasource.username=taskflow
spring.datasource.password=taskflow123
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.open-in-view=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Session Configuration
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# Logging
logging.level.root=INFO
logging.level.com.taskflow=INFO
logging.level.org.springframework.security=INFO
