<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - TaskFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">

    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <div class="flex justify-center">
            <div class="w-12 h-12 rounded-xl bg-sky-600 flex items-center justify-center text-white shadow-lg shadow-sky-600/30">
                <i data-lucide="check-square" class="w-7 h-7"></i>
            </div>
        </div>
        <h2 class="mt-4 text-center text-2xl font-bold tracking-tight text-slate-900">
            Sign in to TaskFlow
        </h2>
        <p class="mt-2 text-center text-sm text-slate-600">
            Production-grade collaborative task management
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md px-4 sm:px-0">
        <div class="bg-white py-8 px-6 shadow-sm border border-slate-200 rounded-xl sm:px-10">

            <!-- Alerts -->
            <div th:if="${errorMessage}"
                 class="mb-4 bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-lg text-sm flex items-center space-x-2">
                <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 text-rose-600"></i>
                <span th:text="${errorMessage}">Invalid credentials</span>
            </div>

            <div th:if="${successMessage}"
                 class="mb-4 bg-emerald-50 border border-emerald-200 text-emerald-700 px-4 py-3 rounded-lg text-sm flex items-center space-x-2">
                <i data-lucide="check-circle" class="w-4 h-4 shrink-0 text-emerald-600"></i>
                <span th:text="${successMessage}">Logged out</span>
            </div>

            <!-- Login Form -->
            <form th:action="@{/login}" method="post" class="space-y-5">
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-700">Username or Email</label>
                    <div class="mt-1 relative">
                        <input id="username" name="username" type="text" required autofocus
                               class="block w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 text-sm"
                               placeholder="john_dev or admin@taskflow.com">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
                    <div class="mt-1 relative">
                        <input id="password" name="password" type="password" required
                               class="block w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 text-sm"
                               placeholder="••••••••">
                    </div>
                </div>

                <div>
                    <button type="submit"
                            class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-white bg-sky-600 hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500 transition-colors">
                        Sign In
                    </button>
                </div>
            </form>

            <!-- Quick Demo Login Credentials Section -->
            <div class="mt-6 pt-6 border-t border-slate-200">
                <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2.5">
                    Demo Credentials (Click to Autofill)
                </p>
                <div class="space-y-1.5">
                    <button type="button" data-demo-user="john_dev" data-demo-pass="User@123"
                            class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs bg-slate-50 hover:bg-sky-50 hover:text-sky-700 text-slate-700 border border-slate-200 transition-colors text-left">
                        <span class="font-medium">👨‍💻 John Developer (User)</span>
                        <span class="text-slate-400 font-mono">john_dev / User@123</span>
                    </button>
                    <button type="button" data-demo-user="sarah_pm" data-demo-pass="User@123"
                            class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs bg-slate-50 hover:bg-sky-50 hover:text-sky-700 text-slate-700 border border-slate-200 transition-colors text-left">
                        <span class="font-medium">👩‍💼 Sarah Mitchell (PM)</span>
                        <span class="text-slate-400 font-mono">sarah_pm / User@123</span>
                    </button>
                    <button type="button" data-demo-user="admin" data-demo-pass="Admin@123"
                            class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs bg-slate-50 hover:bg-sky-50 hover:text-sky-700 text-slate-700 border border-slate-200 transition-colors text-left">
                        <span class="font-medium">🛡️ Alex Morgan (Admin)</span>
                        <span class="text-slate-400 font-mono">admin / Admin@123</span>
                    </button>
                </div>
            </div>

            <!-- Registration Link -->
            <div class="mt-6 text-center">
                <p class="text-sm text-slate-600">
                    Don't have an account?
                    <a th:href="@{/register}" class="font-semibold text-sky-600 hover:text-sky-500">
                        Create an account
                    </a>
                </p>
            </div>

        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
    <script src="/js/main.js"></script>
</body>
</html>
