<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::#content})}">
<head>
    <title>Kanban Board - TaskFlow</title>
</head>
<body>
    <div id="content" class="space-y-6">

        <!-- Header & Project Filter -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
            <div>
                <h2 class="text-lg font-bold text-slate-900">Kanban Board</h2>
                <p class="text-xs text-slate-500">Drag & drop or use quick transitions to manage task workflow stages.</p>
            </div>

            <div class="flex items-center space-x-3">
                <form th:action="@{/kanban}" method="get" class="flex items-center space-x-2">
                    <label for="projectId" class="text-xs font-semibold text-slate-500">Project:</label>
                    <select id="projectId" name="projectId" onchange="this.form.submit()"
                            class="py-1.5 px-3 text-xs rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-sky-500 bg-white">
                        <option value="">All Projects</option>
                        <option th:each="proj : ${projects}"
                                th:value="${proj.id}"
                                th:text="${proj.name}"
                                th:selected="${selectedProjectId == proj.id}">Project</option>
                    </select>
                </form>

                <a th:href="@{/tasks/new(projectId=${selectedProjectId})}"
                   class="inline-flex items-center px-3.5 py-1.5 bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold rounded-lg shadow-sm transition-colors">
                    <i data-lucide="plus" class="w-3.5 h-3.5 mr-1.5"></i>
                    Add Task
                </a>
            </div>
        </div>

        <!-- 3-Column Kanban Board Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

            <div th:each="col : ${columns}" class="flex flex-col rounded-xl bg-slate-100/70 border border-slate-200 p-4 kanban-col">
                <!-- Column Header -->
                <div class="flex items-center justify-between pb-3 border-b border-slate-200/80 mb-3">
                    <div class="flex items-center space-x-2">
                        <span class="w-2.5 h-2.5 rounded-full"
                              th:classappend="${col.status.name() == 'TODO' ? 'bg-slate-500' : (col.status.name() == 'IN_PROGRESS' ? 'bg-sky-600' : 'bg-emerald-500')}"></span>
                        <h3 class="text-sm font-bold text-slate-800" th:text="${col.title}">Column</h3>
                    </div>
                    <span class="px-2 py-0.5 text-xs font-bold rounded-full bg-white text-slate-600 shadow-2xs"
                          th:text="${col.count}">0</span>
                </div>

                <!-- Dropzone & Task Cards List -->
                <div class="flex-1 space-y-3 overflow-y-auto custom-scrollbar kanban-dropzone p-1 rounded-lg transition-colors"
                     th:data-status="${col.status.name()}">

                    <div th:if="${col.count == 0}"
                         class="h-32 border-2 border-dashed border-slate-300 rounded-lg flex items-center justify-center text-xs text-slate-400 font-medium">
                        Drop tasks here
                    </div>

                    <!-- Task Card -->
                    <div th:each="task : ${col.tasks}"
                         th:data-task-id="${task.id}"
                         draggable="true"
                         class="draggable-task task-card bg-white p-4 rounded-xl border border-slate-200/80 shadow-xs hover:border-sky-300 transition-all cursor-grab active:cursor-grabbing space-y-3">

                        <!-- Top: Category & Priority -->
                        <div class="flex items-center justify-between">
                            <span class="px-2 py-0.5 text-[10px] font-semibold rounded bg-slate-100 text-slate-600"
                                  th:text="${task.category}">General</span>

                            <span class="px-2 py-0.5 text-[10px] font-semibold rounded-full"
                                  th:classappend="${task.priority.name() == 'HIGH' ? 'bg-rose-50 text-rose-700' : (task.priority.name() == 'MEDIUM' ? 'bg-amber-50 text-amber-700' : 'bg-emerald-50 text-emerald-700')}"
                                  th:text="${task.priority.displayName}">High</span>
                        </div>

                        <!-- Title -->
                        <div>
                            <a th:href="@{/tasks/{id}(id=${task.id})}"
                               class="text-sm font-semibold text-slate-800 hover:text-sky-600 line-clamp-2"
                               th:text="${task.title}">
                                Task Title
                            </a>
                            <p th:if="${task.project != null}" class="text-[11px] text-slate-400 font-medium mt-1 flex items-center space-x-1">
                                <span class="w-1.5 h-1.5 rounded-full" th:style="'background-color: ' + ${task.project.color}"></span>
                                <span class="truncate" th:text="${task.project.name}">Project Name</span>
                            </p>
                        </div>

                        <!-- Footer: Due Date, Assignee, Quick Move -->
                        <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-xs">
                            <!-- Due date -->
                            <div th:if="${task.dueDate != null}" class="flex items-center space-x-1 text-[11px]"
                                 th:classappend="${task.overdue ? 'text-rose-600 font-bold' : (task.dueToday ? 'text-blue-600 font-bold' : 'text-slate-400')}">
                                <i data-lucide="calendar" class="w-3 h-3"></i>
                                <span th:text="${#temporals.format(task.dueDate, 'MMM dd')}">Date</span>
                            </div>
                            <div th:if="${task.dueDate == null}" class="text-[11px] text-slate-300 italic">
                                No date
                            </div>

                            <!-- Assignee & Move Buttons -->
                            <div class="flex items-center space-x-2">
                                <div th:if="${task.assignee != null}"
                                     class="w-6 h-6 rounded-full flex items-center justify-center text-white text-[10px] font-bold shadow-xs"
                                     th:style="'background-color: ' + ${task.assignee.avatarColor}"
                                     th:title="${task.assignee.fullName}"
                                     th:text="${task.assignee.initials}">
                                    JD
                                </div>

                                <!-- Quick column shifts -->
                                <div class="flex items-center space-x-0.5">
                                    <form th:if="${col.status.name() != 'TODO'}"
                                          th:action="@{/tasks/{id}/status(id=${task.id}, redirect='/kanban')}" method="post">
                                        <input type="hidden" name="status" th:value="${col.status.name() == 'COMPLETED' ? 'IN_PROGRESS' : 'TODO'}">
                                        <button type="submit" class="p-1 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded" title="Move Back">
                                            <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
                                        </button>
                                    </form>

                                    <form th:if="${col.status.name() != 'COMPLETED'}"
                                          th:action="@{/tasks/{id}/status(id=${task.id}, redirect='/kanban')}" method="post">
                                        <input type="hidden" name="status" th:value="${col.status.name() == 'TODO' ? 'IN_PROGRESS' : 'COMPLETED'}">
                                        <button type="submit" class="p-1 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded" title="Move Forward">
                                            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>

                    </div>

                </div>
            </div>

        </div>

    </div>
</body>
</html>
